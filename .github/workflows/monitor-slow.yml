name: monitor-slow

on:
  schedule:
    - cron: "17 */6 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-state
  cancel-in-progress: false

jobs:
  monitor:
    uses: ./.github/workflows/monitor-feed-reusable.yml
    with:
      cadence: slow
      commit-suffix: slow
      skip-on-holiday: ${{ github.event_name == 'schedule' }}
    secrets: inherit
